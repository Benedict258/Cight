    <script>
      // Suppress third-party browser extension errors (e.g. MetaMask / Web3 provider iframe handshake failures)
      (function() {
        function isExtensionError(err) {
          var str = (err && (err.message || err.stack || err.reason || String(err))) || '';
          return (
            typeof str === 'string' &&
            (str.indexOf('MetaMask') !== -1 ||
             str.indexOf('metamask') !== -1 ||
             str.indexOf('ethereum') !== -1 ||
             str.indexOf('Failed to connect to MetaMask') !== -1)
          );
        }
        window.addEventListener('unhandledrejection', function(event) {
          if (isExtensionError(event.reason)) {
            event.preventDefault();
            if (typeof event.stopImmediatePropagation === 'function') {
              event.stopImmediatePropagation();
            }
          }
        }, true);
        window.addEventListener('error', function(event) {
          if (
            isExtensionError(event.error) ||
            isExtensionError(event.message) ||
            (event.filename && (event.filename.indexOf('chrome-extension://') !== -1 || event.filename.indexOf('moz-extension://') !== -1))
          ) {
            event.preventDefault();
            if (typeof event.stopImmediatePropagation === 'function') {
              event.stopImmediatePropagation();
            }
          }
        }, true);
      })();
    </script>
