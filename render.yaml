# Exported from Render dashboard

services:
  - type: web
    name: cight-api
    env: node
    buildCommand: npm install
    startCommand: node server/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URL
        fromDatabase:
          name: cight-mongodb
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        sync: false
    plan: free

databases:
  - name: cight-mongodb
    databaseName: cight
    plan: free
